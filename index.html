<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài thực hành Form - CodeGym</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .card-header {
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        .card-header h2 {
            color: #1e3a8a;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            color: #1e293b;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 6px;
        }

        .radio-item,
        .checkbox-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 11px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-submit {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-reset {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-reset:hover {
            background-color: #cbd5e1;
        }

        .required {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ========================================== -->
        <!-- PHẦN 1: FORM KHẢO SÁT / THÔNG TIN CÁ NHÂN -->
        <!-- ========================================== -->
        <div class="card">
            <div class="card-header">
                <h2>Phần 1: Form thông tin cá nhân</h2>
            </div>
            <form action="" method="POST">
                <!-- Họ và tên: yourname -->
                <div class="form-group">
                    <label for="yourname">Họ và tên <span class="required">*</span></label>
                    <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên của bạn..." required>
                </div>

                <!-- Email: email -->
                <div class="form-group">
                    <label for="p1-email">Email <span class="required">*</span></label>
                    <input type="text" id="p1-email" name="email" placeholder="example@domain.com" required>
                </div>

                <!-- Checkbox sở thích cùng name: hobby -->
                <div class="form-group">
                    <label>Sở thích cá nhân:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" name="hobby" value="football"> Đá bóng
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="hobby" value="reading"> Đọc sách
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="hobby" value="music"> Nghe nhạc
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="hobby" value="travel"> Du lịch
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="hobby" value="gaming"> Chơi game
                        </label>
                    </div>
                </div>

                <!-- Nút Submit và Reset -->
                <div class="button-group">
                    <input type="submit" class="btn btn-submit" value="Gửi thông tin">
                    <input type="reset" class="btn btn-reset" value="Nhập lại">
                </div>
            </form>
        </div>

        <!-- ========================================== -->
        <!-- PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN              -->
        <!-- ========================================== -->
        <div class="card">
            <div class="card-header">
                <h2>Phần 2: Form đăng ký học viên</h2>
            </div>
            <form action="" method="POST">
                <!-- 1. Họ và tên: fullname -->
                <div class="form-group">
                    <label for="fullname">Họ và tên <span class="required">*</span></label>
                    <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
                </div>

                <!-- 2. Email: email -->
                <div class="form-group">
                    <label for="p2-email">Email <span class="required">*</span></label>
                    <input type="email" id="p2-email" name="email" placeholder="nguyenvana@gmail.com" required>
                </div>

                <!-- 3. Số điện thoại: phone -->
                <div class="form-group">
                    <label for="phone">Số điện thoại <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="0912345678" required>
                </div>

                <!-- 4. Ngày sinh: birthday -->
                <div class="form-group">
                    <label for="birthday">Ngày sinh:</label>
                    <input type="date" id="birthday" name="birthday">
                </div>

                <!-- 5. Giới tính: radio gender (Nam, Nữ, Khác) -->
                <div class="form-group">
                    <label>Giới tính:</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="gender" value="male" checked> Nam
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="gender" value="female"> Nữ
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="gender" value="other"> Khác
                        </label>
                    </div>
                </div>

                <!-- 6. Địa chỉ: address -->
                <div class="form-group">
                    <label for="address">Địa chỉ:</label>
                    <textarea id="address" name="address" rows="3" placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành phố..."></textarea>
                </div>

                <!-- 7. Khóa học: select course -->
                <div class="form-group">
                    <label for="course">Khóa học đăng ký <span class="required">*</span></label>
                    <select id="course" name="course" required>
                        <option value="">-- Chọn khóa học --</option>
                        <option value="html_css">HTML & CSS</option>
                        <option value="javascript">JavaScript</option>
                        <option value="java">Java</option>
                        <option value="python">Python</option>
                    </select>
                </div>

                <!-- 8. Hình thức học: radio study_type (Online, Offline) -->
                <div class="form-group">
                    <label>Hình thức học:</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="study_type" value="online" checked> Online
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="study_type" value="offline"> Offline
                        </label>
                    </div>
                </div>

                <!-- 9. Sở thích: checkbox hobby -->
                <div class="form-group">
                    <label>Sở thích:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" name="hobby" value="reading"> Đọc sách
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="hobby" value="coding"> Lập trình
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="hobby" value="sports"> Thể thao
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="hobby" value="music"> Nghe nhạc
                        </label>
                    </div>
                </div>

                <!-- 10. Ghi chú: note -->
                <div class="form-group">
                    <label for="note">Ghi chú thêm:</label>
                    <textarea id="note" name="note" rows="3" placeholder="Nhập nguyện vọng hoặc ghi chú bổ sung..."></textarea>
                </div>

                <!-- 11. Nút Đăng ký và Nhập lại -->
                <div class="button-group">
                    <input type="submit" class="btn btn-submit" value="Đăng ký">
                    <input type="reset" class="btn btn-reset" value="Nhập lại">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
