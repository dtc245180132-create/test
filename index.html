<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Research Survey</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
            background-color: #eef2f5;
            color: #333333;
            padding: 30px 15px;
            line-height: 1.5;
        }

        .survey-container {
            max-width: 680px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid #dcdfe4;
            overflow: hidden;
        }

        .survey-header {
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 24px 30px;
        }

        .survey-header h2 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .survey-header p {
            color: #64748b;
            font-size: 14px;
        }

        form {
            padding: 25px 30px;
        }

        .field-group {
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px dashed #e2e8f0;
        }

        .field-group:last-of-type {
            border-bottom: none;
            margin-bottom: 15px;
        }

        .field-label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            color: #1e293b;
        }

        select.field-select {
            width: 100%;
            max-width: 300px;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            background-color: #fff;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
        }

        .option-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
            color: #334155;
        }

        .option-other-input {
            padding: 4px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
            margin-left: 6px;
            width: 180px;
        }

        .currency-inputs {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
        }

        .currency-box {
            display: inline-flex;
            flex-direction: column;
        }

        .currency-box input {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
        }

        .currency-box label {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        textarea.field-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }

        /* Likert scale table */
        .likert-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        .likert-table th, 
        .likert-table td {
            padding: 10px 8px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .likert-table thead th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
        }

        .likert-table tbody th {
            text-align: left;
            background-color: #ffffff;
            color: #334155;
            font-weight: normal;
            width: 45%;
        }

        .likert-table tbody tr:nth-child(even) th,
        .likert-table tbody tr:nth-child(even) td {
            background-color: #f8fafc;
        }

        .likert-table td label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #64748b;
        }

        .submit-section {
            margin-top: 25px;
        }

        .btn-submit {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 10px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>
    <div class="survey-container">
        <!-- Header -->
        <div class="survey-header">
            <h2>Market Research Survey</h2>
            <p>Please take a few moments to complete this satisfaction survey.</p>
        </div>

        <form action="" method="POST">
            <!-- 1. What is your age range? -->
            <div class="field-group">
                <label class="field-label" for="ageRange">What is your age range?</label>
                <select id="ageRange" name="ageRange" class="field-select">
                    <option value="18-24">18-24</option>
                    <option value="25-34">25-34</option>
                    <option value="35-50">35-50</option>
                    <option value="50+">50+</option>
                </select>
            </div>

            <!-- 2. What is your yearly income range? -->
            <div class="field-group">
                <label class="field-label" for="incomeRange">What is your yearly income range?</label>
                <select id="incomeRange" name="incomeRange" class="field-select">
                    <option value="$0 - $25,000">$0 - $25,000</option>
                    <option value="$25,001 - $50,000">$25,001 - $50,000</option>
                    <option value="$50,001 - $100,000">$50,001 - $100,000</option>
                    <option value="$100,000+">$100,000+</option>
                </select>
            </div>

            <!-- 3. Gender Identity -->
            <div class="field-group">
                <label class="field-label">Gender Identity</label>
                <div class="options-list">
                    <label class="option-item">
                        <input type="radio" name="gender" value="Male" checked> Male
                    </label>
                    <label class="option-item">
                        <input type="radio" name="gender" value="Female"> Female
                    </label>
                    <label class="option-item">
                        <input type="radio" name="gender" value="Nonbinary"> Nonbinary
                    </label>
                    <label class="option-item">
                        <input type="radio" name="gender" value="Other"> Other
                        <input type="text" name="genderOther" class="option-other-input" placeholder="Please specify...">
                    </label>
                </div>
            </div>

            <!-- 4. Which of the following products have your purchased in the last 2 months -->
            <div class="field-group">
                <label class="field-label">Which of the following products have you purchased in the last 2 months. Please check all that apply.</label>
                <div class="options-list">
                    <label class="option-item">
                        <input type="checkbox" name="products" value="Product 1"> Product 1
                    </label>
                    <label class="option-item">
                        <input type="checkbox" name="products" value="Product 2"> Product 2
                    </label>
                    <label class="option-item">
                        <input type="checkbox" name="products" value="Product 3"> Product 3
                    </label>
                </div>
            </div>

            <!-- 5. How often would you use our new product? -->
            <div class="field-group">
                <label class="field-label">How often would you use our new product?</label>
                <div class="options-list">
                    <label class="option-item">
                        <input type="radio" name="frequency" value="Daily" checked> Daily
                    </label>
                    <label class="option-item">
                        <input type="radio" name="frequency" value="Weekly"> Weekly
                    </label>
                    <label class="option-item">
                        <input type="radio" name="frequency" value="Monthly"> Monthly
                    </label>
                </div>
            </div>

            <!-- 6. What would you pay for the new product? -->
            <div class="field-group">
                <label class="field-label">What would you pay for the new product?</label>
                <div class="currency-inputs">
                    <span>$</span>
                    <div class="currency-box">
                        <input type="text" name="priceDollars" size="8">
                        <label>Dollars</label>
                    </div>
                    <span>.</span>
                    <div class="currency-box">
                        <input type="text" name="priceCents" size="3" maxlength="2">
                        <label>Cents</label>
                    </div>
                </div>
            </div>

            <!-- 7. What features would you like to see in the new product -->
            <div class="field-group">
                <label class="field-label" for="features">What features would you like to see in the new product.</label>
                <textarea id="features" name="features" rows="5" class="field-textarea" placeholder="Enter your feedback here..."></textarea>
            </div>

            <!-- 8. Likert scale rating table -->
            <div class="field-group">
                <label class="field-label">Please rate your level of agreement with the following statements.</label>
                <table class="likert-table">
                    <thead>
                        <tr>
                            <th>&nbsp;</th>
                            <th>Strongly Disagree</th>
                            <th>Disagree</th>
                            <th>Agree</th>
                            <th>Strongly Agree</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th>Our products are priced fairly.</th>
                            <td><label><input type="radio" name="rate_price" value="1"> 1</label></td>
                            <td><label><input type="radio" name="rate_price" value="2"> 2</label></td>
                            <td><label><input type="radio" name="rate_price" value="3"> 3</label></td>
                            <td><label><input type="radio" name="rate_price" value="4"> 4</label></td>
                        </tr>
                        <tr>
                            <th>Our products are high quality.</th>
                            <td><label><input type="radio" name="rate_quality" value="1"> 1</label></td>
                            <td><label><input type="radio" name="rate_quality" value="2"> 2</label></td>
                            <td><label><input type="radio" name="rate_quality" value="3"> 3</label></td>
                            <td><label><input type="radio" name="rate_quality" value="4"> 4</label></td>
                        </tr>
                        <tr>
                            <th>You would recommend our product to a friend or coworker.</th>
                            <td><label><input type="radio" name="rate_recommend" value="1"> 1</label></td>
                            <td><label><input type="radio" name="rate_recommend" value="2"> 2</label></td>
                            <td><label><input type="radio" name="rate_recommend" value="3"> 3</label></td>
                            <td><label><input type="radio" name="rate_recommend" value="4"> 4</label></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Submit button -->
            <div class="submit-section">
                <input type="submit" value="Submit" class="btn-submit">
            </div>
        </form>
    </div>
</body>
</html>
