<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Overflow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .overflow-box {
            width: 300px;
            height: 100px;
            background-color: lightgray;
            padding: 10px;
            overflow: auto;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            line-height: 1.5;
            font-size: 14px;
            color: #1e293b;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body>
    <div class="overflow-box">
        Đây là một đoạn văn bản rất dài mà chúng ta sẽ kiểm tra cách `overflow` hoạt động khi nội dung vượt quá kích thước của phần tử. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Phasellus ultricies nunc in mauris pharetra, a ultricies justo fermentum.
    </div>
</body>
</html>
