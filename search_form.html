<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Form Tìm kiếm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }
        .search-container {
            background-color: #f8f9fa;
            border: 1px solid #e2e8f0;
            padding: 24px;
            border-radius: 8px;
            max-width: 500px;
            margin-bottom: 24px;
        }
        input[type="text"] {
            padding: 9px 14px;
            font-size: 15px;
            width: 65%;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            padding: 9px 18px;
            font-size: 15px;
            background-color: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #1557b0;
        }
        .bing-btn {
            background-color: #00809d !important;
        }
        .bing-btn:hover {
            background-color: #006680 !important;
        }
    </style>
</head>
<body>
    <h1>Luyện tập gửi dữ liệu từ Form lên Server</h1>

    <!-- 1. Form tìm kiếm Google theo yêu cầu chính của bài -->
    <div class="search-container">
        <h2>1. Tìm kiếm với Google Search</h2>
        <form action="https://www.google.com.vn/search" method="GET"> 
            <input type="text" name="q" placeholder="Nhập từ khóa..."/>
            <input type="submit" value="Tìm kiếm"/>
        </form>
    </div>

    <!-- 2. Form tìm kiếm Bing theo câu hỏi mở rộng của bài -->
    <div class="search-container">
        <h2>2. Tìm kiếm với Bing (Mở rộng)</h2>
        <form action="https://www.bing.com/search" method="GET"> 
            <input type="text" name="q" placeholder="Nhập từ khóa tìm kiếm trên Bing..."/>
            <input type="submit" class="bing-btn" value="Tìm kiếm Bing"/>
        </form>
    </div>
</body>
</html>
